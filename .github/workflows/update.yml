name: Daily HK Stock Connect Dashboard Update

on:
  schedule:
    # 週一至週五 UTC 08:30 = 香港時間 (HKT) 16:30
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 允許在 GitHub 網頁手動按「Run workflow」即時更新

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HK stock data
        run: python fetch_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --staged --quiet || git commit -m "Update HK stock data $(date +'%Y-%m-%d')"
          git push
